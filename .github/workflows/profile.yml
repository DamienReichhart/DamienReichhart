name: Build profile

on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour to avoid the scheduler rush
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Project cards, commit market, languages, recent pushes -> dist/*.svg
      - name: Generate cards
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      # The README loads everything from the `output` branch, so `main` stays free of bot commits.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
