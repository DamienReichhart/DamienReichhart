<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 128" width="410" height="128" role="img" aria-label="MarketForge: Synthetic OHLCV data for forex, crypto and stocks, realistic enough to backtest and stress-test strategies.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.mu{fill:#8b949e}
.ac{fill:#58a6ff}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes run{to{stroke-dashoffset:-1300}}
@keyframes drop{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}
.in{opacity:0;animation:in .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
</style>
<rect x=".5" y=".5" width="409" height="127" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="20" y="35" class="ac" font-size="16" font-weight="700">MarketForge</text>
<rect x="226.8" y="19" width="163.2" height="22" rx="11" fill="none" stroke="#30363d"/>
<text x="308.4" y="34" class="m mu" font-size="10.5" text-anchor="middle">pip install marketforge</text>
<text x="20" y="61" class="mu" font-size="12.5">Synthetic OHLCV data for forex, crypto and stocks,</text>
<text x="20" y="79" class="mu" font-size="12.5">realistic enough to backtest and stress-test strategies.</text>
<circle cx="25" cy="104" r="5" fill="#3572A5"/>
<text x="38" y="108" font-size="12">Python</text>
<text x="390" y="108" class="m mu" font-size="11.5" text-anchor="end">★ 1  ·  pushed 2026-06</text>
</svg>
