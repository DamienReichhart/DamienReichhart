<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 128" width="410" height="128" role="img" aria-label="BackTrade: Replay historical markets as if they were live: trade in simulated real time, then dissect your performance.">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.mu{fill:#656d76}
.ac{fill:#0969da}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes run{to{stroke-dashoffset:-1300}}
@keyframes drop{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}
.in{opacity:0;animation:in .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
</style>
<rect x=".5" y=".5" width="409" height="127" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="20" y="35" class="ac" font-size="16" font-weight="700">BackTrade</text>
<rect x="290.8" y="19" width="99.2" height="22" rx="11" fill="none" stroke="#d0d7de"/>
<text x="340.4" y="34" class="m mu" font-size="10.5" text-anchor="middle">market replay</text>
<text x="20" y="61" class="mu" font-size="12.5">Replay historical markets as if they were live: trade in</text>
<text x="20" y="79" class="mu" font-size="12.5">simulated real time, then dissect your performance.</text>
<circle cx="25" cy="104" r="5" fill="#3178c6"/>
<text x="38" y="108" font-size="12">TypeScript</text>
<text x="390" y="108" class="m mu" font-size="11.5" text-anchor="end">★ 4  ·  pushed 2026-09</text>
</svg>
