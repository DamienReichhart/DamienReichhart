<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 190" width="410" height="190" role="img" aria-label="Most recently pushed repositories">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.mu{fill:#656d76}
.ac{fill:#0969da}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes run{to{stroke-dashoffset:-1300}}
@keyframes drop{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}
.in{opacity:0;animation:in .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
</style>
<rect x=".5" y=".5" width="409" height="189" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="24" cy="24" r="5" fill="#cf222e"/><circle cx="42" cy="24" r="5" fill="#9a6700"/><circle cx="60" cy="24" r="5" fill="#1a7f37"/>
<text x="390" y="28" class="m mu" font-size="11" text-anchor="end">recent pushes</text>
<line x1="0" x2="410" y1="42" y2="42" stroke="#d0d7de"/>
<text x="20" y="64" class="m" font-size="11.5"><tspan fill="#1a7f37">~</tspan><tspan class="mu"> $ </tspan>ls -t ~/code | head -5</text>
<g class="in" style="animation-delay:0.3s"><text x="20" y="86" class="m mu" font-size="11.5">11-14</text><text x="68" y="86" class="m" font-size="11.5">Homeport</text><text x="390" y="86" class="m" font-size="11.5" text-anchor="end" fill="#3178c6">TypeScript</text></g>
<g class="in" style="animation-delay:0.44999999999999996s"><text x="20" y="105" class="m mu" font-size="11.5">11-13</text><text x="68" y="105" class="m" font-size="11.5">Coffer</text><text x="390" y="105" class="m" font-size="11.5" text-anchor="end" fill="#dea584">Rust</text></g>
<g class="in" style="animation-delay:0.6s"><text x="20" y="124" class="m mu" font-size="11.5">11-09</text><text x="68" y="124" class="m" font-size="11.5">template-fullstack-typescript…</text><text x="390" y="124" class="m" font-size="11.5" text-anchor="end" fill="#3178c6">TypeScript</text></g>
<g class="in" style="animation-delay:0.75s"><text x="20" y="143" class="m mu" font-size="11.5">09-21</text><text x="68" y="143" class="m" font-size="11.5">BackTrade</text><text x="390" y="143" class="m" font-size="11.5" text-anchor="end" fill="#3178c6">TypeScript</text></g>
<g class="in" style="animation-delay:0.8999999999999999s"><text x="20" y="162" class="m mu" font-size="11.5">09-11</text><text x="68" y="162" class="m" font-size="11.5">DeliverTable</text><text x="390" y="162" class="m" font-size="11.5" text-anchor="end" fill="#7355dd">C#</text></g>
<rect x="20" y="169" width="7" height="13" fill="#0969da" style="animation:blink 1s steps(1) infinite"/>
</svg>
